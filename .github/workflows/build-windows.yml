name: Build Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/requirements.txt pyinstaller

      - name: Build AvroShot.exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AvroShot `
            --icon windows/icon.ico `
            --paths linux `
            --collect-all PyQt6 `
            --hidden-import avroshot.platforms.windows `
            --distpath dist `
            --workpath build `
            --specpath build `
            linux/avroshot/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Odist windows/avroshot.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avroshot-windows
          path: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe
          generate_release_notes: true

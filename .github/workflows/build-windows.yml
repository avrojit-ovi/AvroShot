name: Build Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/requirements.txt pyinstaller

      - name: Build AvroShot.exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AvroShot `
            --icon windows/icon.ico `
            --paths linux `
            --hidden-import avroshot.platforms.windows `
            --exclude-module PyQt6.QtQml `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.QtQuick3D `
            --exclude-module PyQt6.QtQuickWidgets `
            --exclude-module PyQt6.Qt3DCore `
            --exclude-module PyQt6.QtNetwork `
            --exclude-module PyQt6.QtMultimedia `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtPdf `
            --exclude-module PyQt6.QtSql `
            --exclude-module PyQt6.QtTest `
            --exclude-module PyQt6.QtDesigner `
            --exclude-module PyQt6.QtHelp `
            --exclude-module PyQt6.QtOpenGL `
            --exclude-module PyQt6.QtSvg `
            --distpath dist `
            --workpath build `
            --specpath build `
            linux/avroshot/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Odist windows/avroshot.iss

      - name: Check artifact sizes (GitHub per-file limit: 100MB)
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 1)
            Write-Host "$($_.Name): $mb MB"
            if ($_.Length -gt 95MB) { Write-Host "::warning::$($_.Name) is close to the 100MB GitHub file limit" }
          }

      - name: Copy exe into windows/ folder
        run: |
          Copy-Item dist\AvroShot.exe windows\AvroShot.exe -Force
          Copy-Item dist\AvroShot-Setup.exe windows\AvroShot-Setup.exe -Force

      - name: Commit exe into windows/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/AvroShot.exe windows/AvroShot-Setup.exe
          git commit -m "Build ${{ github.ref_name }} Windows release: AvroShot.exe + AvroShot-Setup.exe" || Write-Host "No changes to commit"
          git push origin HEAD:main

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avroshot-windows
          path: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe
          generate_release_notes: true

name: Build Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/requirements.txt pyinstaller

      - name: Build AvroShot.exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AvroShot `
            --icon "${{ github.workspace }}\windows\icon.ico" `
            --paths linux `
            --hidden-import avroshot.platforms.windows `
            --exclude-module PyQt6.QtQml `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.QtQuick3D `
            --exclude-module PyQt6.QtQuickWidgets `
            --exclude-module PyQt6.Qt3DCore `
            --exclude-module PyQt6.QtNetwork `
            --exclude-module PyQt6.QtMultimedia `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtPdf `
            --exclude-module PyQt6.QtSql `
            --exclude-module PyQt6.QtTest `
            --exclude-module PyQt6.QtDesigner `
            --exclude-module PyQt6.QtHelp `
            --exclude-module PyQt6.QtOpenGL `
            --exclude-module PyQt6.QtSvg `
            --distpath dist `
            --workpath build `
            --specpath build `
            linux/avroshot/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Locate Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) was not found - the installable setup cannot be built." }
          Write-Host "Using $iscc"
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        run: '& "${{ steps.iscc.outputs.path }}" /Odist windows/avroshot.iss'

      - name: Verify the installable setup was built
        shell: pwsh
        run: |
          foreach ($f in @("dist\AvroShot.exe", "dist\AvroShot-Setup.exe")) {
            if (-not (Test-Path $f)) {
              throw "$f was not produced - refusing to publish a release without the installable setup."
            }
            $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
            Write-Host "$f : $mb MB"
            if ((Get-Item $f).Length -gt 95MB) {
              Write-Host "::warning::$f is close to the 100MB GitHub file limit"
            }
          }

      - name: Smoke-test the installer (silent install + uninstall)
        shell: pwsh
        run: |
          $target = Join-Path $env:LOCALAPPDATA "Programs\AvroShot"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $install = Start-Process -FilePath "dist\AvroShot-Setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $target "AvroShot.exe"))) { throw "Installed AvroShot.exe was not found in $target" }
          $uninstaller = Get-ChildItem $target -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "No uninstaller was created in $target" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $target "AvroShot.exe")) { throw "Uninstall left AvroShot.exe behind" }
          Write-Host "Install and uninstall verified."

      - name: Copy exe into windows/ folder
        shell: pwsh
        run: |
          Copy-Item dist\AvroShot.exe windows\AvroShot.exe -Force -ErrorAction Stop
          Copy-Item dist\AvroShot-Setup.exe windows\AvroShot-Setup.exe -Force -ErrorAction Stop

      - name: Commit exe into windows/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/AvroShot.exe windows/AvroShot-Setup.exe
          git commit -m "Build ${{ github.ref_name }} Windows release: AvroShot.exe + AvroShot-Setup.exe" || Write-Host "No changes to commit"
          git push origin HEAD:main

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avroshot-windows
          path: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AvroShot.exe
            dist/AvroShot-Setup.exe
          generate_release_notes: true

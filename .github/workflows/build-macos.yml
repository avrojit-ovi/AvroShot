name: Build macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect architecture
        run: echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/requirements.txt pyinstaller

      - name: Generate .icns app icon
        run: |
          mkdir -p AvroShot.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size macos/icon.png --out "AvroShot.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) macos/icon.png --out "AvroShot.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AvroShot.iconset -o macos/AvroShot.icns

      - name: Build AvroShot.app with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name AvroShot \
            --osx-bundle-identifier io.github.avroshot.AvroShot \
            --icon macos/AvroShot.icns \
            --paths linux \
            --hidden-import avroshot.platforms.macos \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtQuick3D \
            --exclude-module PyQt6.QtQuickWidgets \
            --exclude-module PyQt6.Qt3DCore \
            --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtWebEngineCore \
            --exclude-module PyQt6.QtPdf \
            --exclude-module PyQt6.QtSql \
            --exclude-module PyQt6.QtTest \
            --exclude-module PyQt6.QtDesigner \
            --exclude-module PyQt6.QtHelp \
            --exclude-module PyQt6.QtOpenGL \
            --exclude-module PyQt6.QtSvg \
            --distpath dist \
            --workpath build \
            --specpath build \
            linux/avroshot/main.py

      - name: Package .app into zip
        run: |
          test -d dist/AvroShot.app
          ditto -c -k --sequesterRsrc --keepParent dist/AvroShot.app "dist/AvroShot-macOS-${ARCH}.zip"

      - name: Check artifact size against GitHub's 100MB per-file limit
        run: |
          for f in dist/*.zip; do
            size=$(stat -f%z "$f")
            mb=$((size / 1024 / 1024))
            echo "$f: ${mb} MB"
            if [ "$size" -gt 99614720 ]; then
              echo "::warning::$f is close to GitHub's 100MB file limit"
            fi
          done

      - name: Copy app zip into macos/ folder
        run: cp "dist/AvroShot-macOS-${ARCH}.zip" "macos/AvroShot-macOS-${ARCH}.zip"

      - name: Commit app zip into macos/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "macos/AvroShot-macOS-${ARCH}.zip"
          git commit -m "Build macOS (${ARCH}) release: AvroShot-macOS-${ARCH}.zip" || echo "No changes to commit"
          git push origin HEAD:main || echo "Nothing to push"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avroshot-macos-${{ env.ARCH }}
          path: dist/AvroShot-macOS-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AvroShot-macOS-*.zip
          generate_release_notes: true

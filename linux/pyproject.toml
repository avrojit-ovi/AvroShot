[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avroshot"
version = "1.0.2"
description = "Fast, Lightshot-style screenshot capture and annotation tool for Ubuntu Linux, Windows, and macOS."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AvroShot Contributors"}
]
keywords = ["screenshot", "lightshot", "ubuntu", "linux", "wayland", "x11", "pyqt6", "annotation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.scripts]
avroshot = "avroshot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avroshot*"]
